# Renderer-equivalence Trial for the frame-assembly module (Map: Frame-assembly module).
# Windowed, so `capture` produces the final composite frame. Run by hand through bnplay once per
# binary (set BNPLAY_BINARY to the binary under test), then compare the two Episodes' frames with
# plans/frame-assembly-module/pixel_diff.py (bnplay's own oracles compare tags inside one Episode).
#
# Scene: the Trial sets no `scene`. After `start`, write /tmp/cata_build_gi_scene (a 7x7 room with
# coloured walls and a light; it gives the lighting passes occluders) and send one `state` request
# to consume it, then `force_rc_rebuild 2` and a few `state` requests. Night, because GPU lighting
# is invisible against daylight.
#
# Knobs go through /tmp/cata_knob, ONE name/value per file and one cheap `state` request per knob
# (the file is consumed by the next request's frame pump; nothing pumps while the driver waits
# in read_line). Freeze first: flicker_gain 0, cloud_strength 0, dust_enable 0, shaft_enable 0.
# A knob written immediately before `capture` lands in that frame. Verify each knob's
# `knob <name> = <v>` ack in the Episode's userdir/config/debug.log after `stop` (the log
# lags the request), none with `(unknown)`. Verify a rebuild capture hit its branch: the
# `[flash][gpu] rebuild: struct=1 ... rc=1` line preceding that capture's `frame capture: wrote`
# line; a steady capture has `struct=0 vis=0 rc=0`.
#
# Measured on osx-arm-slim, 2026-10-07. Nulls (changed pixels outside the noise mask, ~0.002 to
# 0.037% of the 2560x1440 frame): within a launch 36 to 1,400 px; across launches 177 to 1,281 px
# (launch-1 mask) and 59 to 112 px (6-frame mask). Consecutive frames differ by a toggling strip
# near the map centre (1,871 px), so take at least three base frames for the mask.
fixture = "Bairdford"
seed = 7
start_date = "0001-03-10"
time_of_day = "23:00"
wall_clock_limit_s = 1500
mode = "windowed"
window_size = [1280, 720]
