name: Factory CI

# Independent of the upstream-synced workflows (matrix.yml, clang-tidy.yml target `main`).
# Required checks on feature/improvements: guard, deno, json, tidy.
# A factory PR cannot edit this file: the guard job rejects changes under .github/workflows/.
on:
  pull_request:
    branches: [feature/improvements]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: factory-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  BASE_REF: ${{ github.base_ref || 'feature/improvements' }}

jobs:
  # The script and the protected-path list come from the BASE branch, so a PR cannot weaken the
  # list it is judged by. A PR could still edit this workflow; branch protection and the human
  # merge cover that, and the driver's own gate rejects workflow edits from a factory lane first.
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base
      - name: checkout PR head (data only)
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with: { cache: true }
      - name: protected paths untouched by a factory branch
        if: ${{ startsWith(github.head_ref, 'factory/') }}
        run: |
          deno run -A --config base/deno.jsonc base/tools/factory/protected_paths.ts \
            --config base/tools/factory/config.json \
            --repo head \
            --base "origin/$BASE_REF"

  deno:
    name: deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: denoland/setup-deno@v2
        with: { cache: true }
      # fmt and lint judge the files this change touches; the whole tree has pre-existing drift.
      - name: fmt + lint (changed files) and deno test (all)
        run: deno run -A tools/factory/gate.ts --only deno-checks --base "origin/$BASE_REF"

  json:
    name: json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: install build dependencies (json_formatter configures the whole project)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext mold autoconf autoconf-archive automake libtool libltdl-dev \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            libfreetype-dev libharfbuzz-dev libtiff-dev libavif-dev libwebp-dev libjpeg-dev libjxl-dev \
            libsqlite3-dev zlib1g-dev libvulkan-dev
      - name: run JSON syntax validation
        run: build-scripts/lint-json.sh
      # The tree already has formatter drift (data/tts/...), so judge only the JSON this PR changed.
      - name: run JSON formatting check (changed files)
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD -- '*.json' 2>/dev/null || true)
          if [ "${#changed[@]}" -gt 0 ]; then
            build-scripts/format-json.sh "${changed[@]}"
            git diff --exit-code -- '*.json'
          fi
          tools/dialogue_validator.py data/json/npcs/* data/json/npcs/*/* data/json/npcs/*/*/*

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    env:
      CMAKE: 1
      CLANG: clang++
      COMPILER: clang++
      TILES: 1
      SOUND: 1
      BUILD_PATH: "build"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext mold jq \
            sqlite3 libsqlite3-dev zlib1g-dev libvulkan-dev mesa-vulkan-drivers xvfb \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Setup LLVM lint tools
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-${{ env.LLVM_VERSION }}
          clang-format: ${{ env.LLVM_VERSION }}
          clang-tidy: ${{ env.LLVM_VERSION }}
          cmake: true
          ninja: true
          setup-cpp: false

      - name: Install SDL3-devel dependencies
        run: |
          sudo apt-get install libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            libfreetype-dev libharfbuzz-dev \
            libtiff-dev libavif-dev libwebp-dev libjpeg-dev libjxl-dev \
            libflac-dev libvorbis-dev libxmp-dev libmpg123-dev libwavpack-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: factory-tidy-${{ github.ref_name }}
          restore-keys: |
            factory-tidy-${{ github.ref_name }}
            factory-tidy-
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      - name: Install shadercross
        run: bash build-scripts/install-shadercross-vcpkg.sh

      - uses: denoland/setup-deno@v2
        with: { cache: true }

      # The game's configure vendors DirectXShaderCompiler (an LLVM fork) whose targets collide with
      # find_package(Clang), so the plugin is its own project; the game is configured separately
      # only for compile_commands.json.
      - name: build clang-tidy plugin and configure the game
        run: |
          cmake -S tools/clang-tidy-plugin -B plugin -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(llvm-config --cmakedir)" -DCMAKE_PREFIX_PATH="$(llvm-config --prefix)"
          ninja -C plugin CataAnalyzerPlugin
          cmake -S . -B build -G Ninja \
            -DBACKTRACE=ON -DSOUND=0 -DLIBBACKTRACE=0 -DLINKER=mold -DLUA=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: C++ format check on changed files
        run: |
          deno run -A tools/factory/line_filter.ts --base "origin/$BASE_REF" \
            --output line-filter.json --changed changed-cpp.txt
          if [ -s changed-cpp.txt ]; then
            mapfile -t files < <(grep -E '^(src|tests)/.*\.(cpp|h|hpp)$' changed-cpp.txt || true)
            if [ "${#files[@]}" -gt 0 ]; then
              bash build-scripts/format-cpp.sh "${files[@]}"
              git diff --exit-code
            fi
          fi

      - name: clang-tidy on new and changed lines
        run: |
          deno task affected-files --base "origin/$BASE_REF" --head HEAD --output affected_files.txt
          # An empty line filter means "no filtering" to clang-tidy, so nothing added = nothing to check.
          if [ "$(cat line-filter.json)" = "[]" ]; then echo "No added or changed C++ lines."; exit 0; fi
          grep -E '^(src|tests)/.*\.(cpp|h|hpp)$' affected_files.txt > files.txt || true
          if ! grep -q '[^[:space:]]' files.txt; then echo "No files to analyze."; exit 0; fi
          checks="$(jq -r '.lintOnNewLines.checks | map(select(startswith("cata") | not)) | join(",")' tools/factory/config.json)"
          werror="$(jq -r '.lintOnNewLines.warningsAsErrors | join(",")' tools/factory/config.json)"
          plugin="$PWD/plugin/libCataAnalyzerPlugin.so"
          clang-tidy --load="$plugin" --checks="$checks" --list-checks | grep -q cata-no-long
          xargs -a files.txt -n1 -P"$(nproc)" clang-tidy -quiet --load="$plugin" -p build \
            --checks="$checks" --warnings-as-errors="$werror" \
            --line-filter="$(cat line-filter.json)"

  shaders:
    name: shader artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shadercross dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libltdl-dev
      - name: Install shadercross
        run: bash build-scripts/install-shadercross-vcpkg.sh
      - name: Generate shaders
        run: bash build-scripts/generate-shaders.sh
      - uses: actions/upload-artifact@v4
        with:
          name: generated-shaders-factory
          path: data/shaders/
          if-no-files-found: error
