name: Factory guard

# Why pull_request_target: this workflow definition and the script it runs come from the BASE branch,
# so a factory PR cannot weaken the check on itself by editing it. The PR head is checked out as
# data and never executed. Required check: `guard`.
on:
  pull_request_target:
    branches: [feature/improvements]
    types: [opened, reopened, synchronize]

concurrency:
  group: factory-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: checkout base (trusted)
        uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false

      - name: checkout PR head (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with: { cache: true }

      - name: protected paths untouched by a factory branch
        if: ${{ startsWith(github.event.pull_request.head.ref, 'factory/') }}
        run: |
          deno run -A --config base/deno.jsonc base/tools/factory/protected_paths.ts \
            --config base/tools/factory/config.json \
            --repo head \
            --base "origin/${{ github.base_ref }}"
