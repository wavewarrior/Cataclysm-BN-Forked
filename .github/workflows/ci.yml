name: CI

# The one workflow. `deno task check` is the whole definition of done, so CI runs exactly what a
# lane runs, on the same machine and Linux lineage: the home box's WSL2 Ubuntu, through the
# self-hosted runner `cbn-box-wsl` (label `cbn-box`, tmux session `runner`). There are no hosted
# runners: a cold build on four hosted cores takes an hour; the box keeps a warm build tree and has
# 32 threads. Releases are manual from local builds; there is no nightly, no docs publish, no
# translation build and no PR bot.

on:
  pull_request:
    branches: [feature/improvements]
  workflow_dispatch:

# One job at a time, queued, never cancelled: the workspace and its build tree persist between
# runs, and killing a build mid-run corrupts ninja's dependency log.
concurrency:
  group: ci-box
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: [self-hosted, cbn-box]
    timeout-minutes: 60
    # A pull request from a fork would run its own code on this machine: only same-repo
    # branches and manual dispatches run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # An offline configure from the dependency sources the first build already fetched.
      CHECK_SEED_DIR: /home/nigel-beast-unix/cbn/src/out/build/linux-fast
    steps:
      # `clean: false` keeps the ignored `out/` build tree between runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      # The tidy step loads the cata-* plugin, which is its own CMake project.
      - name: Build the clang-tidy plugin
        run: bash build-scripts/build-clang-tidy-plugin.sh

      - name: check
        run: deno task check --no-fix --base "origin/${{ github.base_ref || 'feature/improvements' }}"
